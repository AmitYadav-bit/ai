[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-analyzer"
version = "0.1.0"
description = "AI-powered text analysis: sentiment, keywords, and summarization."
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3.0",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.scripts]
ai-analyzer = "ai_analyzer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
